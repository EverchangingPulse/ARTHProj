name: Test GitHub Pages AR frontend

on:
  push:
    paths:
      - "docs/**"
      - "tests/site.test.mjs"
      - ".github/workflows/test-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/site.test.mjs"
      - ".github/workflows/test-site.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate assets and relative paths
        run: node --test tests/*.test.mjs
      - name: Parse portrait and landscape vector artwork
        run: python3 -c "import xml.etree.ElementTree as ET; [ET.parse(path) for path in ['docs/assets/astrolabe-portrait.svg', 'docs/assets/astrolabe-landscape.svg', 'docs/assets/wind-rose.svg']]"

