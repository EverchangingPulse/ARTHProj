name: Test GitHub Pages AR frontend

on:
  push:
    paths:
      - "docs/**"
      - "tests/site.test.mjs"
      - ".github/workflows/test-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/site.test.mjs"
      - ".github/workflows/test-site.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate assets and relative paths
        run: node --test tests/site.test.mjs
