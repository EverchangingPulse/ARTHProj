name: Test Telegram Worker

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run automated tests
        working-directory: worker
        run: npm test
