<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17100e">
  <meta name="description" content="An enchanted Renaissance instrument revealing forgotten symbols.">
  <title>Speculum Arcana</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=11.6.0">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <main id="camera-stage" class="camera-stage" data-instrument-mode="portrait" aria-label="Speculum Arcana">
    <video id="permission-preview" autoplay muted playsinline hidden aria-hidden="true"></video>
    <a-scene id="ar-scene" embedded
      mindar-image="imageTargetSrc: ; maxTrack: 1; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="colorManagement: true; precision: mediump; antialias: true; alpha: true">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <div id="scanner-hud" class="scanner-hud" data-state="loading" aria-hidden="true">
      <div id="instrument-frame" class="instrument-frame" hidden>
        <div id="compass-aperture-backing" class="compass-aperture-backing" aria-hidden="true"></div>
        <aside id="compass-panel" class="compass-panel embedded-compass" hidden aria-label="Rosa dei venti beneath glass">
          <div class="compass-hinge" aria-hidden="true"></div>
          <div class="compass-casing">
            <div id="wind-rose" class="compass-rotor">
              <img src="./assets/wind-rose-rimless.svg?v=11.0.1" alt="" draggable="false">
            </div>
            <span class="glass-lens" aria-hidden="true"></span>
            <span class="lens-pointer" aria-hidden="true"></span>
            <span class="lens-pivot" aria-hidden="true"></span>
          </div>
          <span class="latch-clasp" aria-hidden="true"></span>
        </aside>
        <img id="hourglass-instrument" class="hourglass-instrument" src="./assets/hourglass-portrait-mask.svg?v=11.4.1" alt="" aria-hidden="true" draggable="false">
        <div class="instrument-picture">
          <img id="portrait-instrument" class="scanner-instrument portrait-instrument" src="./assets/hud-portrait-corrected.svg?v=11.1.0" alt="" draggable="false">
          <img id="landscape-instrument" class="scanner-instrument landscape-instrument" src="./assets/hud-landscape.webp?v=10.0.0" alt="" draggable="false">
        </div>
        <canvas id="amber-lens-camera" class="amber-lens-camera" aria-hidden="true"></canvas>
        <img id="amber-lens-instrument" class="amber-lens-instrument" src="./assets/amber-lens-portrait.svg?v=11.6.0" alt="" aria-hidden="true" draggable="false">
      </div>
    </div>



    <div id="capture-flash" class="capture-flash" hidden aria-hidden="true"></div>
    <div id="polaroid" class="polaroid-frame" hidden aria-label="Stationary picture with revealed symbols">
      <div class="polaroid-paper">
        <canvas id="frozen-canvas" class="frozen-canvas" aria-label="Photograph with revealed symbols"></canvas>
        <div class="polaroid-controls">
          <span class="polaroid-ornament" aria-hidden="true">✥</span>
          <button id="save-btn" class="polaroid-save" type="button" aria-label="Save photograph with revealed symbols">Save image</button>
        </div>
      </div>
    </div>
    <div class="camera-vignette" aria-hidden="true"></div>
    <div id="sr-status" class="visually-hidden" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./ar-app.js?v=11.0.0"></script>
  <script type="module" src="./amber-lens-camera.js?v=11.6.0"></script>
</body>
</html>
